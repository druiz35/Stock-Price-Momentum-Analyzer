name: Propagate template updates
on:
  push:
    branches: main
  workflow_dispatch:
  
jobs:
  check-and-publish:
    if: github.event.repository.name == 'engineering-lab-template'
    runs-on: ubuntu-latest
    steps:      
        
      - name: Invoke Lambda
        id: invoke_lambda 
        env:
          LAMBDA_URL: "https://4nklxum25otgsp6plkrzqoc6xa0iwhvd.lambda-url.us-east-2.on.aws/"
        run: |
          response_output=$(curl -s -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "repository": "${{ github.repository }}",
              "user": "${{ github.actor }}",
              "event_type": "${{ github.event_name }}",
              "commit_sha": "${{ github.sha }}"
            }' \
            "$LAMBDA_URL")

          # Separate the status code from the response body.
          http_code=$(echo "$response_output" | sed 's/.*\(...\)$/\1/')
          response_body=$(echo "$response_output" | sed 's/\(...\)$//')
          
          echo "Lambda returned HTTP status code: $http_code"
          echo "Lambda response body: $response_body"
          
          # Use GITHUB_OUTPUT to make the variables available to other steps
          echo "http_code=$http_code" >> $GITHUB_OUTPUT
          echo "response_body=$response_body" >> $GITHUB_OUTPUT

      - name: Check Lambda Response
        if: steps.invoke_lambda.outputs.http_code != '200'
        run: |
          echo "Lambda invocation failed with HTTP status code: ${{ steps.invoke_lambda.outputs.http_code }}"
          echo "Response Body:"
          echo "${{ steps.invoke_lambda.outputs.response_body }}"
          exit 1 # This will cause the workflow to fail.

      - name: Success
        if: steps.invoke_lambda.outputs.http_code == '200'
        run: |
          echo "Lambda successfully processed the request."
          echo "Response Body:"
          echo "${{ steps.invoke_lambda.outputs.response_body }}" 
